# =============================================================
# ~/.tmux.conf — alameen-adedeji
# Catppuccin Mocha — prefix Ctrl+S — tmux 3.4
# =============================================================

# =============================================================
# CORE BEHAVIOUR
# =============================================================

# set prefix to Ctrl+S (stty -ixon in .bashrc/.zshrc disables flow control freeze)
unbind C-b
set -g prefix C-s

# run-shell, plugins and popups use the server's PATH, which can be bare
# (no Homebrew) depending on how the server was started
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# start windows and panes at 1, not 0 — easier keyboard reach
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on  # renumber on close, no gaps

# increase history limit
set -g history-limit 50000

# word separators for double click selection (keep /, ., :, -, _ in words so file paths are selected whole)
set -g word-separators " @\"'()[]{}<>,;*+?^$|="

# faster key repetition
set -s escape-time 0

# repeatable key timeout (ms) — gives comfortable window for prefix H/J/K/L resizing
set -g repeat-time 700

# mouse on: scroll wheel enters copy mode automatically
set -g mouse on

# focus events for vim/neovim autoread
set -g focus-events on

# extended key codes & hyperlinks (tmux 3.3+): lets nvim and terminal see rich keys & OSC 8 links
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -ga terminal-features "*:hyperlinks"
set -g allow-passthrough on

# terminal colours — critical for Catppuccin to render correctly
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# =============================================================
# KEYBINDINGS
# =============================================================

# reload config
bind r source-file ~/.tmux.conf \; display-message "config reloaded"

# splits: v = vertical (side by side), h = horizontal (stacked)
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
unbind |
unbind -

# new window keeps current path
bind c new-window -c "#{pane_current_path}"

# pane navigation: smart C-h/j/k/l handles pane movement without prefix (below)

# smart pane switching — C-h/j/k/l without prefix
# aware of neovim: passes the key through when focus is in a vim pane
# pairs with christoomey/vim-tmux-navigator in neovim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# pane resizing — repeatable prefix + H/J/K/L (e.g. <prefix> H H H)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# window navigation: p/n (tmux defaults) and ] ([ is copy-mode below)
bind -r p previous-window
bind -r ] next-window

# quick session switching
bind s choose-tree -Zs

# tmux-sessionizer — fzf over project dirs, create/switch named sessions
# <prefix>f  pops a styled floating picker
bind-key -r f display-popup \
    -E \
    -w 55% -h 45% \
    -b rounded \
    -S 'fg=#cba6f7' \
    "/bin/zsh -l -c tmux-sessionizer"

# kill pane/window without confirmation
bind x kill-pane
bind X kill-window

# copy mode — vim keys
set-window-option -g mode-keys vi
bind [ copy-mode
bind Enter display-popup -E -w 90% -h 85% -b rounded -S 'fg=#cba6f7' \
  "/bin/zsh -l -c 'tmp=\$(mktemp /tmp/tmux-scrollback.XXXXXX) && tmux capture-pane -pS -3000 > \"\$tmp\" && nvim +\"normal G\" \"\$tmp\"; rm -f \"\$tmp\"'"
bind -T copy-mode-vi v send-keys -X begin-selection
# copy to clipboard — wl-copy on Linux (Wayland), pbcopy on macOS
if-shell "uname | grep -q Darwin" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'"
bind -T copy-mode-vi Escape send-keys -X cancel

# open file path in Neovim: <prefix> o
bind-key o display-popup -E -w 70% -h 50% -b rounded -S 'fg=#cba6f7' \
  "~/.local/bin/tmux-open-path #{pane_id} #{q:pane_current_path}"

# 2. Mouse: Double-Click any file path / link to open in Neovim (right pane)
#    Passes through to apps that grab the mouse (e.g. nvim itself)
bind-key -n DoubleClick1Pane select-pane -t = \; \
  if-shell -F '#{mouse_any_flag}' 'send-keys -M' \
  "run-shell -b \"~/.local/bin/open-in-nvim #{q:pane_current_path} #{?mouse_hyperlink,#{q:mouse_hyperlink},#{q:mouse_word}}''\""
bind-key -T copy-mode-vi DoubleClick1Pane select-pane -t = \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "~/.local/bin/open-in-nvim"

# 3. In copy mode (<prefix> [), press 'o' on any word/path
bind-key -T copy-mode-vi o run-shell -b "~/.local/bin/open-in-nvim #{q:pane_current_path} #{q:copy_cursor_word}''"

# =============================================================
# CATPPUCCIN MOCHA THEME
# =============================================================

# palette
thm_bg="#1e1e2e"
thm_fg="#cdd6f4"
thm_black="#181825"
thm_gray="#313244"
thm_subtext="#6c7086"
thm_blue="#89b4fa"
thm_mauve="#cba6f7"
thm_red="#f38ba8"
thm_green="#a6e3a1"
thm_yellow="#f9e2af"
thm_peach="#fab387"
thm_teal="#94e2d5"
thm_pink="#f5c2e7"

# status bar
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#{thm_black},fg=#{thm_fg}"

# left — session name
set -g status-left-length 40
set -g status-left "#[bg=#{thm_mauve},fg=#{thm_black},bold] 󱄅 #S #[bg=#{thm_black},fg=#{thm_mauve}]"

# right — host + time
set -g status-right-length 80
set -g status-right "#[fg=#{thm_subtext}]#[fg=#{thm_blue}] #{host_short} #[fg=#{thm_subtext}]│#[fg=#{thm_yellow}] %H:%M #[fg=#{thm_subtext}]│#[fg=#{thm_green}] %d %b"

# window tabs
set -g window-status-format "#[fg=#{thm_subtext}] #I #W "
set -g window-status-current-format "#[bg=#{thm_gray},fg=#{thm_mauve},bold] #I #W #[bg=#{thm_black},fg=#{thm_gray}]"
set -g window-status-separator ""

# pane borders
set -g pane-border-lines double
set -g pane-border-style "fg=#{thm_subtext}"
set -g pane-active-border-style "fg=#{thm_blue}"

# message bar
set -g message-style "bg=#{thm_gray},fg=#{thm_yellow}"
set -g message-command-style "bg=#{thm_gray},fg=#{thm_blue}"

# copy mode highlight
set -g mode-style "bg=#{thm_mauve},fg=#{thm_black}"

# =============================================================
# PLUGINS — TPM
# =============================================================

# tmux 3.3+ no longer infers this automatically — TPM requires it to be set
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'    # sane defaults
set -g @plugin 'tmux-plugins/tmux-resurrect'   # persist sessions across reboot
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save sessions every 15min

# resurrect + continuum settings
set -g @resurrect-capture-pane-contents 'off'  # don't replay pane history on restore (avoids prompt flood)
set -g @resurrect-strategy-nvim 'session'       # restore nvim via `nvim -S` (saves/loads nvim session)
                                                # note: session contents saved to ~/.tmux/resurrect/ in plaintext — local only, never transmitted
set -g @continuum-restore 'on'                 # auto-restore on tmux start (tk saves snapshot after kill)
set -g @continuum-save-interval '15'           # save every 15 minutes

# silence terminal bell
set -g bell-action none
set -g visual-bell off

# initialise TPM — must be last line
run '~/.tmux/plugins/tpm/tpm'
