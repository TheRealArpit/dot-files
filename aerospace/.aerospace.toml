# =============================================================
# ~/.aerospace.toml — AeroSpace window manager config
# Mirrors KDE trial baseline from KEYBINDINGS.md
# Super (KDE) → Cmd (macOS)
# =============================================================

start-at-login = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.bottom     = 8
outer.top        = 8
outer.right      = 8

# =============================================================
# MAIN MODE BINDINGS
# =============================================================

[mode.main.binding]

# ── Focus (Super+H/J/K/L on KDE) ─────────────────────────────
# Note: cmd-h conflicts with macOS "Hide window" system shortcut.
# Disable it in: System Settings → Keyboard → Shortcuts → App Shortcuts
# Add an entry for "Hide <appname>" and set it to something unused,
# or remove the global shortcut entirely.
cmd-h = 'focus left'
cmd-j = 'focus down'
cmd-k = 'focus up'
cmd-l = 'focus right'

# ── Move window (Super+Shift+H/J/K/L on KDE) ─────────────────
cmd-shift-h = 'move left'
cmd-shift-j = 'move down'
cmd-shift-k = 'move up'
cmd-shift-l = 'move right'

# ── Workspaces (Super+1/2 on KDE) ────────────────────────────
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'

# ── Move window to workspace (Super+Shift+1/2 on KDE) ────────
cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'

# ── App launchers (Super+Enter / Super+B on KDE) ─────────────
cmd-enter = 'exec-and-forget open -a Ghostty'
cmd-b     = 'exec-and-forget open -a "Google Chrome"'

# ── Fullscreen (Super+PageUp on KDE — fn+up on MacBook) ───────
cmd-m      = 'fullscreen'
cmd-pageup = 'fullscreen'

# ── Layout toggle ─────────────────────────────────────────────
cmd-slash = 'layout tiles horizontal vertical'

# ── Move window to monitor ────────────────────────────────────
cmd-shift-left  = 'move-node-to-monitor prev'
cmd-shift-right = 'move-node-to-monitor next'

# ── Reload config ─────────────────────────────────────────────
cmd-shift-r = 'reload-config'

# =============================================================
# WORKSPACES
# =============================================================

[[workspaces]]
name = '1'

[[workspaces]]
name = '2'

[[workspaces]]
name = '3'

[[workspaces]]
name = '4'
